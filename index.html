<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <title id="titulo-pagina">Visor de Word en Pantalla</title>

    <!-- Aplica tema, alto contraste y dirección de texto (RTL/LTR) ANTES de
         pintar la página, para evitar parpadeos antes de que main.js corra. -->
    <script>
        (function () {
            const temaGuardado = localStorage.getItem('tema') || 'system';
            const contrasteGuardado = localStorage.getItem('contraste') === 'true';
            const prefiereOscuroSO = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (temaGuardado === 'dark' || (temaGuardado === 'system' && prefiereOscuroSO)) {
                document.documentElement.dataset.theme = 'dark';
            }
            if (contrasteGuardado) {
                document.documentElement.dataset.contraste = 'true';
            }

            const idiomaGuardado = localStorage.getItem('idioma') || (navigator.language.startsWith('en') ? 'en' : 'es');
            if (idiomaGuardado === 'ar' || idiomaGuardado === 'ur') {
                document.documentElement.dir = 'rtl';
            }
        })();
    </script>

    <script src="mammoth.browser.js"></script>
    <script src="main.js" defer></script>
</head>

<body>

    <div class="contenedor">

        <div class="barra-superior">
            <div class="config-wrapper">
                <button type="button" id="btn-config" class="btn-config" aria-haspopup="true"
                    aria-expanded="false" data-i18n-aria-label="configAbrir" aria-label="Abrir configuración">
                    ⚙️
                </button>

                <div id="popup-config" class="popup-config" hidden>
                    <div class="popup-seccion">
                        <h4 data-i18n="configTema">Tema</h4>
                        <label class="radio-opcion">
                            <input type="radio" name="tema" value="light">
                            <span data-i18n="configClaro">Claro</span>
                        </label>
                        <label class="radio-opcion">
                            <input type="radio" name="tema" value="dark">
                            <span data-i18n="configOscuro">Oscuro</span>
                        </label>
                        <label class="radio-opcion">
                            <input type="radio" name="tema" value="system">
                            <span data-i18n="configSistema">Sistema</span>
                        </label>
                    </div>

                    <div class="popup-seccion">
                        <h4 data-i18n="configAccesibilidad">Accesibilidad</h4>
                        <label class="radio-opcion">
                            <input type="checkbox" id="check-contraste">
                            <span data-i18n="configContraste">Alto contraste</span>
                        </label>
                    </div>

                    <div class="popup-seccion popup-seccion--scroll">
                        <h4 data-i18n="configIdioma">Idioma</h4>
                        <label class="radio-opcion">
                            <input type="radio" name="idioma" value="es">
                            <span>Español</span>
                        </label>
                        <label class="radio-opcion">
                            <input type="radio" name="idioma" value="en">
                            <span>English</span>
                        </label>
                        <label class="radio-opcion">
                            <input type="radio" name="idioma" value="zh">
                            <span>中文</span>
                        </label>
                        <label class="radio-opcion">
                            <input type="radio" name="idioma" value="hi">
                            <span>हिन्दी</span>
                        </label>
                        <label class="radio-opcion">
                            <input type="radio" name="idioma" value="fr">
                            <span>Français</span>
                        </label>
                        <label class="radio-opcion">
                            <input type="radio" name="idioma" value="ar">
                            <span>العربية</span>
                        </label>
                        <label class="radio-opcion">
                            <input type="radio" name="idioma" value="bn">
                            <span>বাংলা</span>
                        </label>
                        <label class="radio-opcion">
                            <input type="radio" name="idioma" value="pt">
                            <span>Português</span>
                        </label>
                        <label class="radio-opcion">
                            <input type="radio" name="idioma" value="ru">
                            <span>Русский</span>
                        </label>
                        <label class="radio-opcion">
                            <input type="radio" name="idioma" value="ur">
                            <span>اردو</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <h2 data-i18n="titulo">Insertar y Visualizar Documento de Word</h2>

        <div id="estado" class="estado-libreria" style="color: #d9534f;">Verificando conexión con
            librería Mammoth...</div>

        <button type="button" id="btn-seleccionar" class="input-zona" data-i18n="btnSeleccionar">
            Haz clic aquí para seleccionar tu archivo (.docx)
        </button>
        <label for="archivo-word" class="visualmente-oculto" data-i18n="labelArchivo">
            Seleccionar archivo Word
        </label>
        <input type="file" id="archivo-word" accept=".docx" style="display: none;">

        <div id="info-archivo" class="info-archivo" hidden></div>

        <h3 data-i18n="contenidoTitulo">Contenido del Documento:</h3>
        <div id="visor-contenido">El documento seleccionado se mostrará aquí...</div>

        <div id="acciones-documento" class="acciones-documento" hidden>
            <button type="button" id="btn-descargar" class="btn-accion" data-i18n="btnDescargar">
                Descargar como HTML
            </button>
            <button type="button" id="btn-copiar" class="btn-accion" data-i18n="btnCopiar">
                Copiar HTML
            </button>
            <button type="button" id="btn-quitar" class="btn-accion btn-accion-peligro" data-i18n="btnQuitar">
                Quitar documento
            </button>
        </div>
    </div>

    <footer class="pie-pagina">
        <div class="pie-seccion">
            <a href="https://github.com/Afard-max/docx-to-html" target="_blank" rel="noopener noreferrer"
                data-i18n="footerRepo">Código en GitHub</a>
            <a href="https://github.com/mwilliamson/mammoth.js" target="_blank" rel="noopener noreferrer"
                data-i18n="footerMammoth">Hecho con Mammoth.js</a>
        </div>
        <div class="pie-seccion">
            <a href="https://github.com/Afard-max" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://www.linkedin.com/in/TU-USUARIO-AQUI" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </div>
    </footer>

</body>

</html>
